name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` is load-bearing: without it the PR-text gate below only reruns on the next
    # push and reads that event's payload, so a title fixed afterwards still fails and a
    # title edited afterwards to add a tell passes.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # A title or body edit cannot change the build, so it must not pay for one.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      # The whole gate is one script, so what runs here is what runs on a laptop.
      - run: bin/ci

  secret-scan-history:
    # bin/ci scans the checkout it is given, which is shallow here. Full history is the
    # case that matters for a leak: a key removed in a later commit is still published.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact .

  pr-text:
    # A pull request's title and body never touch the git tree, so no tree scan can see
    # them. Same script, so there is one source of truth for the rule.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: PR text has no slop
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | bin/slop-guard --stdin "PR text"
