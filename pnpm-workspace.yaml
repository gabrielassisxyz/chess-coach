packages:
  - packages/*
# Dependencies whose install scripts may run. pnpm blocks every other package's scripts,
# which is the right default; each entry here is a deliberate exception.
allowBuilds:
  esbuild: true
  better-sqlite3: true
# pnpm refuses packages younger than its minimum release age; the Agent SDK is pinned to
# an exact version and moves faster than that window, so it is excluded from the rule.
minimumReleaseAgeExclude:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.318"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.318"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.318"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.318"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.318"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.318"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.318"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.318"
  - "@anthropic-ai/claude-agent-sdk@0.3.318"
